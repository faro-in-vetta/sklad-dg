<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Склад пряжі — прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --ink:#1A1A1A; --muted:#8A7A68; --line:#E6DCCD;
  --gold:#B68C5A; --gold-deep:#8A6030; --gold-light:#E8C87A;
  --primary:#1A1208; --on-primary:#F5F0EA;
  --indigo:#8A6030; --indigo-soft:#F3EADC;
  --saffron:#B68C5A; --saffron-soft:#F6ECDD;
  --green:#3D7350; --green-soft:#E6F0E6;
  --red:#A5362C; --red-soft:#F7E4DF;
  --plum:#7A4E6E; --plum-soft:#F2E7EF;
  --stone:#4A3C2E; --stone-soft:#EFE9E0;
  --plat-a:#FFFFFF; --plat-b:#F2EADF; --plat-ink:#1A1A1A; --plat-edge:#E0D5C5;
  --radius-lg:12px; --radius-sm:6px;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#110C07; --surface:#1B140D; --ink:#F5F0EA; --muted:#A89880; --line:#3A2E20;
    --gold:#C9A06A; --gold-deep:#D7B27C; --primary:#C9A06A; --on-primary:#1A1208;
    --indigo:#D7B27C; --indigo-soft:#2E2315;
    --saffron:#D7B27C; --saffron-soft:#2E2315;
    --green:#7FBF93; --green-soft:#17281C;
    --red:#E3897E; --red-soft:#3A1C18;
    --plum:#D3A6C6; --plum-soft:#2D1D29;
    --stone:#D9CBB8; --stone-soft:#2A2118;
    --plat-a:#2A2016; --plat-b:#1F170F; --plat-ink:#F5F0EA; --plat-edge:#4A3A28;
  }
}
:root[data-theme="dark"]{
  --bg:#110C07; --surface:#1B140D; --ink:#F5F0EA; --muted:#A89880; --line:#3A2E20;
  --gold:#C9A06A; --gold-deep:#D7B27C; --primary:#C9A06A; --on-primary:#1A1208;
  --indigo:#D7B27C; --indigo-soft:#2E2315;
  --saffron:#D7B27C; --saffron-soft:#2E2315;
  --green:#7FBF93; --green-soft:#17281C;
  --red:#E3897E; --red-soft:#3A1C18;
  --plum:#D3A6C6; --plum-soft:#2D1D29;
  --stone:#D9CBB8; --stone-soft:#2A2118;
  --plat-a:#2A2016; --plat-b:#1F170F; --plat-ink:#F5F0EA; --plat-edge:#4A3A28;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;padding-bottom:88px;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

header.top{position:sticky;top:0;z-index:5;background:var(--surface);padding:12px 0 10px;border-bottom:2.5px solid var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.top-row{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.dglogo{width:44px;height:44px;flex:none;border-radius:4px;display:block}
.dgtext{min-width:0;display:flex;flex-direction:column}
.dgname{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-size:18px;font-weight:600;letter-spacing:.3px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.dgsub{font-size:8.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
@media (max-width:400px){.online > .num{display:none}.online{padding-right:4px}}
@media (max-width:420px){.dgname{font-size:15px}.dgsub{font-size:7px;letter-spacing:1.5px}.dglogo{width:38px;height:38px}}
.brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.online{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 4px;flex:none;font-size:13px;color:var(--ink)}
.avs{display:flex}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;border:2px solid var(--surface);position:relative;flex:none}
.avs .av+.av{margin-left:-8px}
.av.big{width:38px;height:38px;font-size:14px}
.av .st{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface);background:#B8AC9C}
.av .st.on{background:#3D9A5C}
.av.big .st{width:12px;height:12px}
.urow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.urow:first-of-type{border-top:0}
.urow .me{font-size:11px;background:var(--indigo-soft);color:var(--indigo);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:600}
.who{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 8px;font-size:13px;width:112px;flex:none}
.search{margin-top:12px;display:flex;gap:8px}
.qwrap{flex:1;min-width:0;position:relative}
.qwrap .lens{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--muted);pointer-events:none}
.search input{width:100%;padding-left:40px !important;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:11px 12px}

.btn{border:1px solid var(--primary);border-radius:var(--radius-sm);padding:11px 14px;font-weight:600;background:var(--primary);color:var(--on-primary);letter-spacing:.2px;transition:background .15s,border-color .15s,color .15s}
.btn:not(:disabled):hover{border-color:var(--gold)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--gold)}
.btn.ghost:not(:disabled):hover{background:var(--gold);color:#fff}
.btn.small{padding:7px 10px;font-size:14px}
.btn.in{background:var(--green);border-color:var(--green);color:#fff}
.btn.out{background:var(--red);border-color:var(--red);color:#fff}
.btn.res{background:var(--gold);border-color:var(--gold);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}

main{padding-top:14px}
.sku{display:flex;gap:12px;align-items:stretch;background:var(--surface);border-radius:var(--radius-lg);padding:10px;margin-bottom:10px;border:1px solid var(--line);width:100%;text-align:left}
.thumb{width:74px;height:74px;border-radius:12px;flex:none;object-fit:cover;background:var(--indigo-soft);display:grid;place-items:center;overflow:hidden}
.sku .body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.sku .sinfo{font-weight:700;font-size:12.5px;line-height:1.25;overflow-wrap:anywhere;display:grid;grid-template-columns:1fr 1fr;gap:1px 10px}
.sku .sthumb{width:34px;height:34px;border-radius:8px;align-self:flex-start;border:1px solid var(--line)}
.sku:has(.slevels) .body{justify-content:flex-start}
.sku:has(.slevels){display:grid !important;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto 1fr;column-gap:10px;row-gap:5px}
.sku:has(.slevels) > .body{grid-column:1;grid-row:1}
.sku:has(.slevels) > .scol{grid-column:2;grid-row:1 / span 2}
.sku:has(.slevels) > .slevels{grid-column:1;grid-row:2;align-self:start}
.sku .slevels{flex-basis:100%;margin:0;gap:4px}
.sku .slevels .chip{padding:1px 6px;font-size:11.5px}
.sku:has(.slevels){align-content:flex-start;align-items:flex-start;row-gap:5px;padding:8px 10px 7px;margin-bottom:6px;gap:10px}
.sku:has(.slevels){flex-wrap:wrap}
.sku .scol{display:flex;flex-direction:column;gap:6px;align-items:center;flex:none}
.delsku{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;color:var(--red);background:var(--surface)}
.delsku svg{width:17px;height:17px}
.delsku.off{color:var(--muted);opacity:.45}
.chip.sale{background:var(--indigo-soft);color:var(--indigo);font-weight:700}
.sku .art{font-weight:700;font-size:17px}
.sku .color{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.levels{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{border-radius:8px;padding:3px 8px;font-size:13px;font-weight:500}
.chip.stock{background:var(--indigo-soft);color:var(--indigo)}
.chip.resv{background:var(--saffron-soft);color:var(--saffron)}
.chip.free{background:var(--green-soft);color:var(--green)}
.chip.warn{background:var(--red-soft);color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:25}
nav.tabs .in{display:flex;max-width:720px;width:100%;align-items:center}
nav.tabs button{flex:1;min-width:0;background:none;border:0;padding:6px 0;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button[aria-current="true"]{color:var(--indigo);font-weight:700}
nav.tabs svg{width:22px;height:22px}
nav.tabs .tabbtn svg,nav.tabs [data-tab] svg{box-sizing:content-box;padding:4px 14px;border-radius:999px;transition:background .15s}
nav.tabs .tabbtn[aria-current="true"] svg,nav.tabs [data-tab][aria-current="true"] svg{background:var(--indigo-soft)}

/* sheets */
.sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(10,14,25,.5)}
.sheet.open{display:block}
.panel{position:absolute;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));max-height:calc(94vh - 62px);overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.panel{animation:none}}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.panel-head h2{flex:1;margin:0;font-size:20px}
.x{background:var(--surface);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;font-size:20px;line-height:1}

label.f{display:block;margin-bottom:12px;font-size:14px;color:var(--muted)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:11px 12px;color:var(--ink)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 12px}
.err{background:var(--red-soft);color:var(--red);padding:10px 12px;border-radius:var(--radius-sm);margin-bottom:12px;font-size:14px}
.check{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:14px}

.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.slot{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--muted);font-size:13px;position:relative;overflow:hidden;text-align:center}
.slot img{width:100%;height:100%;object-fit:cover}
.slot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.slot .rm{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:26px;height:26px;z-index:2}

.gallery{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.gallery img,.gallery .thumb{width:112px;height:112px;border-radius:14px;flex:none;object-fit:cover}

.levels-big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.lv{border-radius:14px;padding:10px}
.lv b{display:block;font-size:13px;font-weight:500}
.lv .kg{font-size:21px;font-weight:700;line-height:1.15}
.lv .cn{font-size:14px}
.lv.stock{background:var(--indigo-soft);color:var(--indigo)}
.lv.resv{background:var(--saffron-soft);color:var(--saffron)}
.lv.free{background:var(--green-soft);color:var(--green)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.actions .btn{background:linear-gradient(180deg,var(--plat-a) 0%,var(--plat-b) 100%);color:var(--plat-ink);border:1px solid var(--plat-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 2px rgba(20,25,40,.12);display:flex;align-items:center;justify-content:center;gap:8px}
.actions .btn:not(:disabled):active{background:linear-gradient(180deg,var(--plat-b) 0%,var(--plat-a) 100%)}
.actions .btn .dot{width:9px;height:9px;border-radius:50%;flex:none}
.actions .wide{grid-column:1/-1}
.tag.smp{background:var(--plum-soft);color:var(--plum)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:12px;margin-bottom:12px}
.box h3{margin:0 0 8px;font-size:16px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.meta dt{color:var(--muted)}.meta dd{margin:0}
/* смужка заповнення сховища. Клас .bar уже зайнятий графіком аналітики. */
.usebar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.usebar > i{display:block;height:100%;border-radius:999px;background:var(--gold);transition:width .3s}
.usebar.warn > i{background:#C9871F}
.usebar.crit > i{background:var(--red)}
/* компактні відступи — лише всередині .compact (панель «Доступ і дані») */
.compact .box{padding:10px 12px;margin-bottom:8px}
.compact .box h3{font-size:16px;margin:0 0 6px}
.compact label.f{margin-bottom:8px;font-size:13px}
.compact label.f input,.compact label.f select,.compact label.f textarea{padding:8px 10px;margin-top:3px}
.compact .hint{margin:-4px 0 8px;font-size:12px;line-height:1.35}
.compact .urow{padding:8px 0;gap:10px}
.compact .btn{padding:9px 12px}
.compact .btn.small{padding:6px 9px;font-size:13px}
.compact .meta{gap:3px 10px;font-size:13px}
.compact .err{padding:8px 10px;margin-bottom:8px;font-size:13px}
.barcode{background:#fff;border-radius:10px;padding:6px;text-align:center;overflow-x:auto}
.barcode svg{max-width:100%;height:auto}

.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-of-type{border-top:0}
.row .tag{flex:none;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:600}
.tag.in{background:var(--green-soft);color:var(--green)}
.tag.out{background:var(--red-soft);color:var(--red)}
.tag.res{background:var(--saffron-soft);color:var(--saffron)}
.tag.adj{background:var(--indigo-soft);color:var(--indigo)}
.row .grow{flex:1;min-width:0}
.row .sub{color:var(--muted);font-size:13px}
.row .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.soon{color:var(--red);font-weight:600}

.video{width:100%;border-radius:16px;background:#000;aspect-ratio:3/4;object-fit:cover}
.scan-alt{display:grid;gap:8px;margin-top:12px}
.filebtn{position:relative;overflow:hidden;text-align:center}
.filebtn input{position:absolute;inset:0;opacity:0}

.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;display:none;max-width:90vw}
.demo-note{font-size:13px;color:var(--muted);text-align:center;margin:18px 0 6px}

.swatch-grp{font-size:12px;color:var(--muted);margin:8px 0 4px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
.sw{aspect-ratio:1;border-radius:50%;border:1px solid rgba(0,0,0,.15);padding:0;position:relative}
.sw[aria-pressed="true"]{outline:3px solid var(--indigo);outline-offset:2px}
.hex-row{display:flex;align-items:center;gap:10px;margin:10px 0 12px;font-size:14px;color:var(--muted)}
.hex-row input[type=color]{width:46px;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface)}
.hex-prev{width:28px;height:28px;border-radius:50%;border:1px solid var(--line)}
.prices{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:13px}
.prices span{color:var(--muted)}
.prices b{color:var(--ink);font-weight:600}
.mk{border-radius:8px;padding:1px 7px;font-weight:700}
.mk.pos{background:var(--green-soft)}.mk.neg{background:var(--red-soft)}
.pricebox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pricebox > .pt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;color:var(--ink);position:relative;min-width:0}
.pricebox > button.pt:not(:disabled):hover{border-color:var(--indigo)}
.pricebox > button.pt > b:first-of-type{padding-right:16px}
.pricebox .pen{position:absolute;top:8px;right:8px;width:15px;height:15px;color:var(--indigo)}
.pricebox > button.pt:disabled{opacity:1;cursor:default}
.pricebox > button.pt:disabled .pen{display:none}
.skuhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.skuhead .info{flex:1;min-width:0;font-weight:700;font-size:17px;line-height:1.35;overflow-wrap:anywhere}
.skuhead .compbox{flex:0 1 150px;min-width:0;font-size:14px;line-height:1.3}
.compbox > b{display:block;text-transform:uppercase;letter-spacing:1.1px;font-size:10px;color:var(--muted);font-weight:500;margin-bottom:3px}
.compbox .cl{font-weight:600;overflow-wrap:anywhere}
.compbox .cp{font-family:var(--serif);font-weight:600;color:var(--gold-deep);font-variant-numeric:lining-nums}
.ctypes{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.ctypes span{font-size:10.5px;background:var(--indigo-soft);color:var(--gold-deep);border-radius:5px;padding:1px 6px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 86px 36px;gap:6px;margin-bottom:6px}
.cman{display:flex;min-width:0}
.cman input{flex:1;min-width:0;border-radius:6px 0 0 6px !important;text-align:left !important}
.cman button{border:1px solid var(--line);border-left:0;background:var(--surface);border-radius:0 6px 6px 0;padding:0 10px;color:var(--gold-deep)}
.crow select,.crow input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 8px;min-width:0}
.crow input{text-align:right}
.crow .rmc{border:1px solid var(--line);background:var(--surface);border-radius:6px;color:var(--red);font-size:18px}
.ctot{font-size:13px;margin:2px 0 12px}
@media (max-width:420px){.skuhead .sw-big{width:96px;height:96px}}
.skuhead .sw-big{width:110px;height:110px;border-radius:16px;flex:none;object-fit:cover;border:1px solid var(--line)}
.plat{background:linear-gradient(180deg,var(--plat-a) 0%,var(--plat-b) 100%);color:var(--plat-ink);border:1px solid var(--plat-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 2px rgba(20,25,40,.12);display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-bottom:12px}
.plat .dot{width:9px;height:9px;border-radius:50%;flex:none}
.label{background:#fff;color:#111;border:1px solid #E6DCCD;border-radius:10px;max-width:320px;margin:4px auto 12px;padding:14px 16px 10px;text-align:center;box-shadow:0 2px 8px rgba(20,25,40,.08)}
.label .ll{text-align:left;font-size:16px;font-weight:700;line-height:1.25;overflow-wrap:anywhere;color:#111}
.label .ll.la{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.invprev table.ip-t th{background:#F3EADC;border:1px solid #D9CBB8;padding:5px;text-align:left;font-weight:600}
.invprev table.ip-t td{border:1px solid #D9CBB8;padding:5px;vertical-align:middle}
.invprev table.ip-t .c{text-align:center}
.invprev .ip-tot{text-align:right;margin-top:10px}
.invprev .ip-tot .big{font-size:15px;margin-top:4px}
.invprev .ip-tot .big b{color:#8A6030}
.invprev .ip-w{margin-top:12px;line-height:1.5}
.invprev .ip-f{margin-top:14px;font-size:11px}
.invprev .ip-f::after{content:'';display:block}

body.locked{overflow:hidden}
body.locked > header, body.locked > main, body.locked > nav{filter:blur(3px);pointer-events:none}
.auth{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:14px;padding:22px 20px;box-shadow:0 8px 30px rgba(26,18,8,.12);text-align:center}
.auth-card .f{text-align:left}
.syncdot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none;margin-right:2px}
.syncdot.saving{background:var(--gold)}
.syncdot.err{background:var(--red)}
</style>

async function refreshPhotoUrls() {

  (data || []).forEach(x => { if (x.signedUrl) PHOTO_URL[x.path] = x.signedUrl; });

/* ---------- запис ---------- */
function save() { DIRTY = true; queueSync(); return true; }

let syncTimer = null;
function queueSync() {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { pushChanges(); }, 250);
}

async function pushChanges() {
  if (SYNCING) { queueSync(); return; }
  SYNCING = true; DIRTY = false;
  setSync('saving');
  try {
    // фото → Storage
    for (const s of S.skus) {
      for (let i = 0; i < (s.photos || []).length; i++) {
        const p = s.photos[i];
        if (p && p.startsWith('data:')) {
          const blob = await (await fetch(p)).blob();
          const path = `${s.id}/${crypto.randomUUID()}.jpg`;
          const { error } = await db.storage.from('sku-photos').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
          if (!error) { s.photos[i] = path; PHOTO_URL[path] = p; }
        }
      }
    }

    // SKU
    for (const s of S.skus) {
      const row = skuRowDb(s);
      if (changed('sku', s.id, row)) {
        const { error } = await db.from('skus').upsert(row);
        if (error) throw error; remember('sku', s.id, row);
      }
      // ціни закупівлі
      for (const c of (s.costs || [])) {
        const row2 = { id: c.id, sku_id: s.id, price: +c.price, date: dOnly(c.date) };
        if (changed('cost', c.id, row2)) {
          const { error } = await db.from('sku_costs').upsert(row2);
          if (!error) remember('cost', c.id, row2);
        }
      }
      const localIds = new Set((s.costs || []).map(c => c.id));
      for (const k of Object.keys(SNAP)) {
        if (!k.startsWith('cost:')) continue;
        const row2 = JSON.parse(SNAP[k]);
        if (row2.sku_id === s.id && !localIds.has(row2.id)) {
          await db.from('sku_costs').delete().eq('id', row2.id);
          delete SNAP[k];
        }
      }
      if (s.costActive) await db.from('sku_costs').update({ active: true }).eq('id', s.costActive);
    }

    // операції (тільки додаються)
    for (const o of S.ops) {
      const row = opRowOf(o);
      if (!SNAP[snapKey('op', o.id)]) {
        const { error } = await db.from('ops').insert(row);
        if (error) throw error; remember('op', o.id, row);
      }
    }

    // заявки
    for (const o of S.reserves) {
      const row = orderRowOf(o);
      if (changed('order', o.id, row)) {
        const { error } = await db.from('orders').upsert(row);
        if (error) {
          if (error.code === '23505') { // номер зайнято — беремо наступний
            o.no = (await nextNoFromDb(o.yy));
            const r2 = orderRowOf(o);
            const { error: e2 } = await db.from('orders').upsert(r2);
            if (e2) throw e2; remember('order', o.id, r2);
          } else throw error;
        } else remember('order', o.id, row);
      }
      const rows = o.lines.map((l, i) => { l.id = l.id || crypto.randomUUID(); return lineRowOf(o, l, i); });
      for (const r of rows) {
        if (changed('line', r.id, r)) {
          const { error } = await db.from('order_lines').upsert(r);
          if (!error) remember('line', r.id, r);
        }
      }
      const keep = new Set(rows.map(r => r.id));
      for (const k of Object.keys(SNAP)) {
        if (!k.startsWith('line:')) continue;
        const r = JSON.parse(SNAP[k]);
        if (r.order_id === o.id && !keep.has(r.id)) { await db.from('order_lines').delete().eq('id', r.id); delete SNAP[k]; }
      }
      for (const p of (o.payments || [])) {
        p.id = p.id || crypto.randomUUID();
        if (!SNAP[snapKey('pay', p.id)]) {
          const row2 = { id: p.id, order_id: o.id, amount: +p.amount, paid_on: dOnly(p.at) };
          const { error } = await db.from('payments').insert(row2);
          if (!error) remember('pay', p.id, row2);
        }
      }
      for (const r of (o.returns || [])) {
        r.id = r.id || crypto.randomUUID();
        if (!SNAP[snapKey('ret', r.id)]) {
          const row2 = { id: r.id, order_id: o.id, returned_on: dOnly(r.at), reason: r.reason || null, amount: +r.sum || 0 };
          const { error } = await db.from('returns').insert(row2);
          if (!error) {
            remember('ret', r.id, row2);
            const items = (r.items || []).map(it => ({ return_id: r.id, sku_id: it.sku, kg: +it.kg || 0, cones: +it.cones || 0 }));
            if (items.length) await db.from('return_lines').insert(items);
          }
        }
      }
      for (const e of (o.events || [])) {
        e.id = e.id || crypto.randomUUID();
        if (!SNAP[snapKey('ev', e.id)]) {
          const row2 = { id: e.id, order_id: o.id, text: e.text, created_at: tsOf(e.at) };
          const { error } = await db.from('order_events').insert(row2);
          if (!error) remember('ev', e.id, row2);
        }
      }
    }

    // журнал змін карток
    for (const a of (S.audit || [])) {
      a.id = a.id || crypto.randomUUID();
      if (!SNAP[snapKey('audit', a.id)]) {
        const row = { id: a.id, sku_id: a.sku, act: a.act, text: a.text, created_at: tsOf(a.at) };
        const { error } = await db.from('audit').insert(row);
        if (!error) remember('audit', a.id, row);
      }
    }

    // люди й запрошення
    for (const u of S.users) {
      const row = { id: u.id, name: u.name, role: u.role, removed: !!u.removed };
      if (changed('profile', u.id, row)) {
        const { error } = await db.from('profiles').update({ name: u.name, role: u.role, removed: !!u.removed, removed_at: u.removed ? new Date().toISOString() : null }).eq('id', u.id);
        if (!error) remember('profile', u.id, row);
      }
    }
    // Запрошення створює й видаляє Edge Function / окремі виклики — тут нічого не синхронізуємо.

    setSync('ok');
  } catch (e) {
    console.error(e);
    setSync('err');
    toast('Не вдалося зберегти: ' + (e.message || 'помилка мережі'));
  } finally {
    SYNCING = false;
    if (DIRTY) queueSync();
  }
}

function costInfo(sku){
  const list = (sku.costs||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));

function addCost(sku, dateIso, price){

function pricing(sku, l){
  l = l || levels(sku.id);
  let sale = +sku.sale || 0, src = 'прайс';
  if(!sale){
    let k=0, v=0;
    S.ops.forEach(o=>{ if(o.sku===sku.id && o.type==='out' && o.price>0){ k+=o.kg; v+=o.kg*o.price; } });
    sale = k ? v/k : 0; src = 'сер. фактична';
  }
  const markup = l.cost && sale ? (sale-l.cost)/l.cost*100 : null;
  return {cost:l.cost, sale, src, markup};
}
const fmtPct = p => p===null ? '—' : (p>0?'+':'')+p.toLocaleString('uk-UA',{maximumFractionDigits:1})+'%';
function levels(skuId){
  let kg=0, cn=0, inKg=0, inCn=0, pk=0, pv=0;
  S.ops.filter(o=>o.sku===skuId).forEach(o=>{
    const sgn = (o.type==='out'||o.type==='smp') ? -1 : 1;
    kg += sgn*o.kg; cn += sgn*o.cones;
    if(o.type==='in'){ inKg+=o.kg; inCn+=o.cones; if(o.price>0){ pk+=o.kg; pv+=o.kg*o.price; } }
  });
  let rk=0, rc=0;
  S.reserves.forEach(o=>{ if(o.status==='active') (o.lines||[]).forEach(li=>{ if(li.sku===skuId){ rk+=li.kg; rc+=li.cones; } }); });
  const avg = inCn ? inKg/inCn : 0;
  const curAvg = cn>0 ? kg/cn : 0;
  const drift = avg && cn>0 ? Math.abs(curAvg-avg)/avg : 0;
  return {kg, cn, rk, rc, fk:kg-rk, fc:cn-rc, avg, drift, cost: costInfo(skuById(skuId)||{}).price};
}

function nextOrderNo(){ const yy=curYY(); S.orderSeqByYear=S.orderSeqByYear||{}; return {yy, no:(S.orderSeqByYear[yy]||0)+1}; }
const lShip = li => li.shipKg ?? li.kg, lShipC = li => li.shipCones ?? li.cones;
const lq = li => Math.max(0, Math.round(((li.shipKg ?? li.kg) - (+li.retKg||0))*100)/100);
const lc = li => Math.max(0, (li.shipCones ?? li.cones) - (+li.retCones||0));
const oRetKg = o => o.lines.reduce((t,li)=>t+(+li.retKg||0),0);
const hasRet = o => o.lines.some(li=>+li.retKg>0||+li.retCones>0);
const oKg = o => o.lines.reduce((t,li)=>t+lq(li),0);
const oCn = o => o.lines.reduce((t,li)=>t+lc(li),0);
const oSum = o => o.lines.reduce((t,li)=>t+(li.sample?0:lq(li)*li.price),0);
const oDeliv = o => +o.delivery || 0;
const oShip = o => o.shipMode==='client' ? oDeliv(o) : 0;   // йде в інвойс
const oCar = o => o.shipMode==='client' ? 0 : oDeliv(o);    // наші витрати
const CONE_KG = 0.04;
const fmtG = kg => fmtN(Math.round(kg*1000))+' г';
const fmtKg2 = kg => (Math.round(kg*100)/100).toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2});
const oBoxes = o => Math.max(0, parseInt(o.boxes)||0);
const oConesKg = o => oCn(o)*CONE_KG;
const oBoxKg = o => +o.boxKg>0 ? +o.boxKg : (+o.grossKg>0 ? Math.max(0, Math.round((+o.grossKg - oKg(o) - oConesKg(o))*100)/100) : 0);
const oGross = o => oKg(o)+oConesKg(o)+oBoxKg(o);
const oPaid = o => (o.payments||[]).reduce((t,p)=>t+(+p.amount||0),0);
const oOwed = o => Math.max(0, +(oTotal(o)-oPaid(o)).toFixed(2));
const oOver = o => Math.max(0, +(oPaid(o)-oTotal(o)).toFixed(2));
const oTotal = o => oSum(o)+oShip(o);
const hasSmp = o => o.lines.some(li=>li.sample);
const allSmp = o => o.lines.length>0 && o.lines.every(li=>li.sample);
const pos = n => n===1?'позиція':(n>=2&&n<=4?'позиції':'позицій');
function oStage(o){
  if(o.status==='cancelled') return 'cancel';
  if(o.status==='shipped') return allSmp(o)?'sample':((o.paid||oOwed(o)<=0.009)?'done':'unpaid');
  if(!o.pickAt) return 'res';
  if(!o.pickedAt) return 'pick';
  if(!o.approvedAt && !o.sample) return 'wait';
  return 'ready';
}
const STAGE = {res:'Створена', pick:'Збірка на складі', wait:'Зібрано · чекає', ready:'Готово до відвантаження', unpaid:'Відвантажено · не оплачено', done:'Відвантажено · оплачено', sample:'Відвантажено · пробники', cancel:'Анульовано'};
const STAGE_CLS = {res:'st-res', pick:'st-pick', wait:'st-wait', ready:'st-ready', unpaid:'st-unpaid', done:'st-done', sample:'st-sample', cancel:'st-cancel'};
function stageLabel(o){ const k=oStage(o); if(k==='unpaid'&&oPaid(o)>0) return 'Відвантажено · оплачено частково'; if(k==='wait') return o.terms==='prepay'?'Зібрано · чекає передоплати':'Зібрано · чекає дозволу'; return STAGE[k]; }
function oev(o,text){ o.events=o.events||[]; o.events.push({at:now(),who:S.current,text}); }
function oById(id){ return S.reserves.find(o=>o.id===id); }
function qtyCheck(){ return ''; } // вага конусів у стоках різна, не обмежуємо
const daysOver = o => o.due ? Math.floor((new Date(todayStr()) - new Date(o.due.slice(0,10)))/86400000) : 0;
const dayWord = n => (n%10===1&&n%100!==11)?'день':((n%10>=2&&n%10<=4)&&!(n%100>=12&&n%100<=14))?'дні':'днів';
const clientCheck = c => /\p{L}.*\p{L}/u.test(c) ? '' : 'Назва клієнта має містити літери.';
const reservedIn = (o,skuId) => o && o.status==='active' ? o.lines.filter(li=>li.sku===skuId).reduce((t,li)=>({kg:t.kg+li.kg,cn:t.cn+li.cones}),{kg:0,cn:0}) : {kg:0,cn:0};
const termsText = o => o.sample?'Пробники, без оплати':`${o.terms==='prepay'?'Передоплата':`Відтермінування ${o.days} дн.`}${hasSmp(o)?' · є пробники':''}`;

let oFilter='all', oFrom='', oTo='';

  const oq=($('#oq')?.value||'').trim().toLowerCase();
  const inQ = o => !oq || [orderNo(o),o.client,o.comment,...o.lines.map(li=>{const x=skuById(li.sku)||{}; return [x.art,x.maker,x.color].join(' ');})].some(v=>String(v||'').toLowerCase().includes(oq));
  const base = S.reserves.filter(o=>inP(o)&&inQ(o));
  const groups = [['all','Усі'],['res','Створені'],['pick','Збірка'],['wait','Чекає оплати'],['ready','До відправки'],['unpaid','Не оплачені'],['done','Оплачені'],['sample','Пробники'],['cancel','Анульовані']];
  const cnt = k => k==='all'?base.length:base.filter(o=>oStage(o)===k).length;
  const list = base.filter(o=>oFilter==='all'||oStage(o)===oFilter).sort((a,b)=>b.at.localeCompare(a.at));
  const unpaid = S.reserves.filter(o=>oStage(o)==='unpaid');
  const debt = unpaid.reduce((t,o)=>t+oOwed(o),0);
  const overdue = unpaid.filter(o=>o.due && o.due.slice(0,10)<todayStr()).length;
  $('#view').innerHTML = `
    ${can('fin')&&unpaid.length?`<div class="obar num"><span>Очікуємо оплату <b>${fmtEur0(debt)}</b></span><span>Прострочено <b class="${overdue?'neg':''}">${overdue}</b></span></div>`:''}
    <div class="odates">
      <label><span>з</span><input type="date" id="oFrom" value="${oFrom}" aria-label="Дата з"></label>
      <label><span>по</span><input type="date" id="oTo" value="${oTo}" aria-label="Дата по"></label>
      <select id="oPer" aria-label="Період">
        <option value="" ${oFrom||oTo?'selected':''} hidden>Період</option>
        <option value="all" ${!oFrom&&!oTo?'selected':''}>Весь час</option>
        <option value="month">Цей місяць</option>
        <option value="prev">Минулий місяць</option>
      </select>
    </div>
    <div class="ofilt">${groups.map(([k,n])=>`<button class="hf ${k===oFilter?'on':''}" data-of="${k}"><span class="ofl">${n}</span><span class="ofc num">${cnt(k)}</span></button>`).join('')}</div>
    ${list.length?list.map(orderCard).join(''):'<div class="empty">Заявок за цими умовами немає.</div>'}`;
}
function lineHtml(o, li, i){
  const s=skuById(li.sku)||{};
  return `<div class="oli"><div class="odl-h"><span class="lno">${i+1}</span>${skuRow(s)}</div><div class="sub num oliq">${fmtKg(lq(li))} кг / ${fmtN(lc(li))} к${li.sample?' · <span class="stg st-sample">пробник</span>':(seeSale()?` · ${fmtEur(li.price)}/кг = <b>${fmtEur(lq(li)*li.price)}</b>`:'')}</div></div>`;
}
function orderActions(o){
  const st=oStage(o), mine=o.who===S.current, b=[];
  if(st==='res' && can('pick')) b.push(`<button class="btn small" data-opick="${o.id}">Взяти в збірку</button>`);
  if(st==='pick' && can('pick')) b.push(`<button class="btn small" data-opicked="${o.id}">Зібрано</button>`);
  if(st==='wait' && can('fin')) b.push(`<button class="btn small in" data-oappr="${o.id}">${o.terms==='prepay'?'Передоплату отримано':'Дозволити відвантаження'}</button>`);
  if(st==='ready' && can('ship')) b.push(`<button class="btn small out" data-oship="${o.id}">Відвантажити</button>`);
  if(st==='unpaid' && can('fin')) b.push(`<button class="btn small in" data-opaid="${o.id}">Оплату отримано</button>`);
  if(o.status==='shipped' && can('fin')) b.push(`<button class="btn small ghost" data-oret="${o.id}">Повернення</button>`);
  if(!['cancel','done','sample'].includes(st) && (can('fin') || (o.status==='active' && mine && (can('order')||can('smp'))))) b.push(`<button class="btn small ghost" data-ocancel="${o.id}">Анулювати</button>`);
  if(seeSale()) b.push(`<button class="btn small ghost" data-oinv="${o.id}">На друк</button>`);
  return b;
}
function orderCard(o){
  const st=oStage(o), n=o.lines.length;

  const b=orderActions(o);
  return `<div class="ocard" data-oview="${o.id}" role="button" tabindex="0" aria-label="Відкрити заявку № ${orderNo(o)}">
    <div class="ohead"><b class="num">№ ${orderNo(o)}</b><span class="stg ${STAGE_CLS[st]}">${stageLabel(o)}</span>${o.sample&&st!=='sample'?'<span class="stg st-sample">пробники</span>':''}${hasRet(o)?'<span class="stg st-cancel" style="text-decoration:none">повернення</span>':''}</div>

    ${o.lines.slice(0,2).map((li,i)=>lineHtml(o,li,i)).join('')}
    ${n>2?`<div class="sub" style="color:var(--gold-deep);font-size:13px;margin:2px 0 4px">+ ще ${n-2} ${pos(n-2)}</div>`:''}
    <div class="sub" style="color:var(--muted);font-size:13px">${!seeSale()?'':termsText(o)}${o.paid&&!allSmp(o)?` · оплачено ${fmtDate(o.paidAt)}`:''}${!o.paid&&oPaid(o)>0?` · оплачено ${fmtEur(oPaid(o))}, залишок <b style="color:var(--ink)">${fmtEur(oOwed(o))}</b>`:''}${o.due&&!o.paid?` · <span class="${overdue?'neg':''}">оплатити до ${fmtDate(o.due)}${overdue?` (прострочено ${daysOver(o)} ${dayWord(daysOver(o))})`:''}</span>`:''}</div>
    <div class="sub" style="color:var(--muted);font-size:13px">${fmtDate(o.at)} · ${esc(uname(o.who))}${o.comment?' · '+esc(o.comment):''}${o.cancelReason?' · причина: '+esc(o.cancelReason):''}</div>
    ${b.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${b.join('')}</div>`:''}
  </div>`;
}

function saveOrderDraft(){
  syncOD();
  const o=OD.id?oById(OD.id):null;
  if(o && !canEditOrder(o)) return;
  const anySale=OD.lines.some(li=>!li.sample);
  if(anySale && !can('order')) return drawOrderEditor('Ваша роль дозволяє додавати лише пробники. Позначте всі позиції як пробники.');
  if(!can('order') && !can('smp')) return;
  const client=OD.client.trim();
  if(!client) return drawOrderEditor('Вкажіть клієнта.');
  if(clientCheck(client)) return drawOrderEditor(clientCheck(client));
  if(!OD.lines.length) return drawOrderEditor('Додайте хоча б одну позицію з каталогу.');
  const lines=[];
  for(const li of OD.lines){
    const s=skuById(li.sku), l=levels(li.sku), mine=reservedIn(o,li.sku), name=s.art+(s.color?' · '+s.color:'');
    const kg=parseFloat(li.kg)||0, cn=parseInt(li.cones)||0, price=li.sample?0:(parseFloat(li.price)||0);
    if(kg<=0) return drawOrderEditor(`${esc(name)}: вкажіть кг.`);
    if(cn<0) return drawOrderEditor(`${esc(name)}: кількість конусів не може бути від'ємною.`);
    const qc=qtyCheck(l,kg,cn); if(qc) return drawOrderEditor(`${esc(name)}: ${qc}.`);
    if(kg>l.fk+mine.kg+0.001) return drawOrderEditor(`${esc(name)}: вільно лише ${fmtKg(l.fk+mine.kg)} кг.`);
    if(cn>l.fc+mine.cn) return drawOrderEditor(`${esc(name)}: вільно лише ${fmtN(l.fc+mine.cn)} конусів.`);
    if(!li.sample && !(price>0)) return drawOrderEditor(`${esc(name)}: вкажіть ціну.`);
    lines.push({sku:li.sku,kg,cones:cn,price,sample:!!li.sample});
  }
  const smp=lines.every(li=>li.sample);
  const dv=parseInt(OD.days)||0;
  if(!smp && OD.terms!=='prepay' && !(dv>0 && dv<=365)) return drawOrderEditor('Вкажіть кількість днів відтермінування (від 1 до 365).');
  const terms=smp?'sample':(OD.terms==='prepay'?'prepay':'deferred'), days=smp||OD.terms==='prepay'?0:dv;
  const comment=OD.comment.trim();
  const shipMode=OD.shipMode==='client'?'client':'us';
  const sumTxt = ls => `${ls.length} ${pos(ls.length)}, ${fmtKg(ls.reduce((t,x)=>t+x.kg,0))} кг / ${fmtN(ls.reduce((t,x)=>t+x.cones,0))} к`;
  if(!o){
    const nx=nextOrderNo(); S.orderSeqByYear[nx.yy]=nx.no;
    const no={id:uid(),yy:nx.yy,no:nx.no,client,sample:smp,terms,days,comment,shipMode,shipping:0,lines,who:S.current,at:now(),status:'active',events:[]};
    oev(no,`${smp?'Заявку на пробники':'Заявку'} створено: ${sumTxt(lines)}, доставка ${shipMode==='client'?'за рахунок клієнта':'за наш рахунок'}, товар у резерві`);
    S.reserves.push(no);
    if(save()){ toast(`Заявку № ${orderNo(no)} створено`); OD=null; closeSheet(); tab='reserves'; oFilter='all'; render(); }
    return;
  }
  const art = id => (skuById(id)||{}).art||'?';
  const ch=[];
  if(client!==o.client) ch.push(`клієнт: ${o.client} → ${client}`);
  if(smp!==!!o.sample) ch.push(smp?'тип: продаж → пробники':'тип: пробники → продаж');
  lines.forEach(n=>{ const old=o.lines.find(x=>x.sku===n.sku); if(old && !!old.sample!==!!n.sample) ch.push(`${art(n.sku)}: ${n.sample?'стало пробником':'стало платною позицією'}`); });
  if(!smp && (terms!==o.terms||days!==o.days)) ch.push(`умови: ${termsText(o)} → ${terms==='prepay'?'Передоплата':`Відтермінування ${days} дн.`}`);
  lines.forEach(n=>{ const old=o.lines.find(x=>x.sku===n.sku);
    if(!old) ch.push(`додано ${art(n.sku)}: ${fmtKg(n.kg)} кг / ${fmtN(n.cones)} к`);
    else if(Math.abs(old.kg-n.kg)>0.0001||old.cones!==n.cones||old.price!==n.price) ch.push(`${art(n.sku)}: ${fmtKg(old.kg)} кг / ${fmtN(old.cones)} к${n.sample?'':` · ${fmtEur(old.price)}`} → ${fmtKg(n.kg)} кг / ${fmtN(n.cones)} к${n.sample?'':` · ${fmtEur(n.price)}`}`); });
  o.lines.forEach(x=>{ if(!lines.some(n=>n.sku===x.sku)) ch.push(`прибрано ${art(x.sku)}`); });
  if(shipMode!==(o.shipMode||'us')) ch.push(`доставка: ${shipMode==='client'?'за рахунок клієнта':'за наш рахунок'}`);
  if(comment!==(o.comment||'')) ch.push('коментар змінено');
  if(!ch.length) return drawOrderEditor('Змін немає.');
  Object.assign(o,{client,sample:smp,terms,days,comment,shipMode,lines});
  oev(o,'Змінено: '+ch.join('; '));
  if(save()){ toast('Заявку № '+orderNo(o)+' змінено'); render(); openOrderView(o.id); }
}

/* --- мінімальний генератор .docx --- */
const crcTable=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(buf){let c=0xFFFFFFFF;for(let i=0;i<buf.length;i++)c=crcTable[(c^buf[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){
  const enc=new TextEncoder(); const chunks=[]; const central=[]; let offset=0;
  const u16=v=>[v&255,(v>>8)&255], u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  files.forEach(f=>{
    const name=enc.encode(f.name), data=typeof f.data==='string'?enc.encode(f.data):f.data, crc=crc32(data);
    const head=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
    chunks.push(head,name,data);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset)]),name);
    offset+=head.length+name.length+data.length;
  });
  let cSize=0; central.forEach(c=>cSize+=c.length);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cSize),...u32(offset),...u16(0)]);
  const total=[...chunks,...central,end];
  let len=0; total.forEach(c=>len+=c.length);
  const out=new Uint8Array(len); let p=0; total.forEach(c=>{out.set(c,p); p+=c.length;});
  return out;
}
const xs = t => String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function wP(text, o){

  const runs=(Array.isArray(text)?text:[{t:text}]).map(r=>`<w:r><w:rPr>${r.b||o.b?'<w:b/>':''}${r.i?'<w:i/>':''}<w:sz w:val="${(r.sz||o.sz||21)}"/><w:szCs w:val="${(r.sz||o.sz||21)}"/>${(r.color||o.color)?`<w:color w:val="${r.color||o.color}"/>`:''}${(r.font||o.font)?`<w:rFonts w:ascii="${r.font||o.font}" w:hAnsi="${r.font||o.font}"/>`:''}</w:rPr><w:t xml:space="preserve">${xs(r.t)}</w:t></w:r>`).join('');

async function exportInvoice(id){
  const o=oById(id); if(!o||!seeSale()) return;
  let bytes;
  try{ bytes=invoiceDocx(o); }catch(e){ toast('Не вдалося сформувати документ'); return; }
  const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  const filename=`Замовлення ${orderNo(o).replace('/','-')} ${o.client}.docx`;
  let dl=null;
  try{ dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; }catch(e){ dl=null; }
  if(dl){
    try{ await dl.save({filename, data:blob}); toast('Замовлення збережено'); }
    catch(e){ if(e && e.code!=='declined') toast('Замовлення: '+((e&&e.message)||'не вдалося зберегти')); }
    return;
  }
  try{
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
  }catch(e){ toast('Завантаження тут недоступне'); }
}

function saveReturn(id){
  const o=oById(id); if(!o||!can('fin')||o.status!=='shipped') return;
  const fe=m=>{$('#rterr').innerHTML=`<div class="err">${m}</div>`; $('#panel').scrollTop=0;};

  if(dv < o.shippedAt.slice(0,10)) return fe(`Дата не може бути раніше відвантаження (${fmtDate(o.shippedAt)}).`);
  const at=dateToIso(dv), items=[];
  for(let i=0;i<o.lines.length;i++){
    const li=o.lines[i], x=skuById(li.sku)||{};
    const kg=Math.round((parseFloat($(`[data-rtk="${i}"]`).value)||0)*100)/100, cn=parseInt($(`[data-rtc="${i}"]`).value)||0;
    if(kg<0||cn<0) return fe(`${esc(x.art)}: від'ємні значення.`);
    if(kg>lq(li)+0.001) return fe(`${esc(x.art)}: можна повернути не більше ${fmtKg(lq(li))} кг.`);
    if(cn>lc(li)) return fe(`${esc(x.art)}: можна повернути не більше ${fmtN(lc(li))} конусів.`);
    if(kg>0||cn>0) items.push({i,kg,cn});
  }
  if(!items.length) return fe('Вкажіть, скільки повертається.');
  let sum=0;
  items.forEach(({i,kg,cn})=>{
    const li=o.lines[i], x=skuById(li.sku)||{};
    S.ops.push({id:uid(),sku:li.sku,type:'ret',sample:!!li.sample,kg,cones:cn,price:li.sample?0:li.price,who:S.current,at,party:o.client,comment:`Повернення заявки № ${orderNo(o)}${reason?': '+reason:''}`,order:o.id});
    li.retKg=Math.round(((+li.retKg||0)+kg)*100)/100; li.retCones=(+li.retCones||0)+cn;
    if(!li.sample) sum+=kg*li.price;
  });
  o.returns=o.returns||[]; o.returns.push({id:uid(),at,by:S.current,reason,sum:+sum.toFixed(2),items:items.map(({i,kg,cn})=>({sku:o.lines[i].sku,kg,cones:cn}))});
  const txt=items.map(({i,kg,cn})=>`${(skuById(o.lines[i].sku)||{}).art}: ${fmtKg(kg)} кг / ${fmtN(cn)} к`).join('; ');
  oev(o,`Повернення ${fmtDate(at)}: ${txt}${sum?`, сума зменшена на ${fmtEur(sum)}`:''}${reason?`. Причина: ${reason}`:''}`);
  if(save()){ toast('№ '+orderNo(o)+': повернення проведено'); refreshOrders(); }
}

/* Доступи створює Edge Function invite-user (працює під service_role).
   Пошта не використовується: логін перетворюється на службову адресу. */
async function callAccess(body){
  try{
    const { data, error } = await db.functions.invoke('invite-user', { body });
    if(error){
      let msg = '';
      try { msg = (await error.context.json()).error; } catch(_){}
      return { ok:false, msg: msg || 'Сервер не відповів. Спробуйте ще раз.' };
    }
    if(data && data.error) return { ok:false, msg:data.error };
    return { ok:true, data };
  }catch(e){

/* пароль без плутанини між O/0 та I/l */
function genPass(){
  const abc='ABCDEFGHJKLMNPQRSTUVWXYZ', low='abcdefghijkmnpqrstuvwxyz', dig='23456789';
  const all=abc+low+dig, r=n=>all[Math.floor(Math.random()*all.length)];
  let out = abc[Math.floor(Math.random()*abc.length)] + low[Math.floor(Math.random()*low.length)] + dig[Math.floor(Math.random()*dig.length)];
  for(let i=0;i<7;i++) out += r();
  return out.split('').sort(()=>Math.random()-0.5).join('');
}

  const el = document.getElementById(id); if(!el) return;

/* --- скільки зайнято місця --- */
const MB = 1024*1024;
const fmtMB = b => b >= 1024*MB ? (b/1024/MB).toFixed(2)+' ГБ' : Math.round(b/MB)+' МБ';

function usageRow(title, used, limitMb, note){
  const limit = (limitMb||0) * MB;
  const pct = limit ? Math.min(100, used/limit*100) : 0;
  const cls = pct >= 90 ? 'crit' : pct >= 75 ? 'warn' : '';
  return `<div style="margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;font-size:14px">
      <span>${title}</span><b class="num">${fmtMB(used)} з ${fmtMB(limit)}</b>
    </div>
    <div class="usebar ${cls}"><i style="width:${pct.toFixed(1)}%"></i></div>
    <div class="hint" style="margin:0">${Math.round(pct)}% зайнято${note?' · '+note:''}</div>
  </div>`;
}

/* ---------- analytics ---------- */
function monthly(){
  const cost = {}; S.skus.forEach(x=>cost[x.id]=levels(x.id).cost);
  const m = {};
  S.ops.forEach(o=>{
    const k = o.at.slice(0,7);
    const r = m[k] || (m[k]={month:k,inKg:0,inCn:0,inSum:0,outKg:0,outCn:0,rev:0,cogs:0,smpKg:0,smpCost:0,ship:0,car:0,shipExp:0});
    if(o.type==='in'){ r.inKg+=o.kg; r.inCn+=o.cones; r.inSum+=o.kg*(o.price||0); }
    if(o.type==='ret' && o.sample){ r.smpKg-=o.kg; r.smpCost-=o.kg*(cost[o.sku]||0); }
    else if(o.type==='ret'){ r.outKg-=o.kg; r.outCn-=o.cones; r.rev-=o.kg*(o.price||0); r.cogs-=o.kg*(cost[o.sku]||0); }
    if(o.type==='smp'){ r.smpKg+=o.kg; r.smpCost+=o.kg*(cost[o.sku]||0); }
    if(o.type==='out'){ r.outKg+=o.kg; r.outCn+=o.cones; r.rev+=o.kg*(o.price||0); r.cogs+=o.kg*(cost[o.sku]||0); }
  });
  S.reserves.forEach(o=>{ if(o.status!=='shipped'||!oDeliv(o)||!o.shippedAt) return;
    const k=o.shippedAt.slice(0,7);
    const r=m[k]||(m[k]={month:k,inKg:0,inCn:0,inSum:0,outKg:0,outCn:0,rev:0,cogs:0,smpKg:0,smpCost:0,ship:0,car:0,shipExp:0});
    r.ship+=oShip(o); r.car+=oCar(o); r.shipExp+=oCar(o); });
  return Object.values(m).sort((a,b)=>a.month.localeCompare(b.month)).map(r=>Object.assign(r,{margin:r.rev-r.cogs-r.smpCost-r.shipExp}));
}

async function deliverFile(buf, filename){
  let dl = null;
  try{ dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; }catch(e){ dl=null; }
  if(dl){
    try{ await dl.save({filename, data:new Blob([buf])}); toast('Файл збережено'); }
    catch(e){ if(e && e.code!=='declined') toast('Не вдалося зберегти файл'); }
    return;
  }
  try{
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
  }catch(e){ toast('Експорт тут недоступний'); }
}

async function printLabel(id){
  const s = skuById(id);
  if(!window.jspdf || !window.JsBarcode){ toast('Бібліотеки друку не завантажились'); return; }
  toast('Готую етикетку…');
  try{ await Promise.all(['500','700','800'].map(w=>document.fonts.load(w+' 30px Inter'))); }catch(e){}
  const W=58, H=40, k=12; // мм, пікселів на мм
  const c=document.createElement('canvas'); c.width=W*k; c.height=H*k;
  const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
  g.fillStyle='#000'; g.textBaseline='top';
  const M=2.2*k, fullW=c.width-2*M, gap=1.6*k, colW=(fullW-gap)/2;
  const F=(w,z)=>{ g.font=`${w} ${z}px Inter, Arial, sans-serif`; };
  const L=[s.maker?'Brand: '+s.maker:'', 'Art.: '+s.art], Rr=[s.color?'Color: '+s.color:'', s.meter?nmText(s.meter):''];
  const comp=compSorted(s.comp).map(x=>({p:fmtPctC(x.p)+'%',f:x.f}));
  const fitCell=(t,z)=>{ F(700,z); if(g.measureText(t).width<=colW) return t; let x=t; while(x.length>1 && g.measureText(x+'…').width>colW) x=x.slice(0,-1); return x+'…'; };
  const compLines=(z)=>{ // розкладка складників у рядки
    const out=[]; let cur=[], w=0, sp=z*0.55;
    comp.forEach(c=>{ F(700,z); const wp=g.measureText(c.p+' ').width; F(500,z); const wf=g.measureText(c.f).width; const tw=wp+wf;
      if(cur.length && w+sp+tw>fullW){ out.push({items:cur,w}); cur=[]; w=0; }
      cur.push({...c,wp,wf}); w+= (cur.length>1?sp:0)+tw; });
    if(cur.length) out.push({items:cur,w});
    return out;
  };
  const minBar=11*k;
  let z=30, zc, lines, lh, lhc, textH;
  for(;z>=13;z--){
    zc=Math.max(11,Math.round(z*0.82)); lh=Math.round(z*1.22); lhc=Math.round(zc*1.25);
    lines=compLines(zc);
    textH = 2*lh + (comp.length? 0.9*k + lines.length*lhc : 0);
    F(700,z);
    const cellsFit=[...L,...Rr].every(t=>!t||g.measureText(t).width<=colW);
    if(cellsFit && M*0.8+textH+0.9*k+minBar<=c.height-1.2*k) break;
  }
  const Lt=L.map(t=>t&&fitCell(t,z)), Rt=Rr.map(t=>t&&fitCell(t,z));
  F(700,z);
  const lw=Math.max(...Lt.map(t=>t?g.measureText(t).width:0)), rw=Math.max(...Rt.map(t=>t?g.measureText(t).width:0));
  const blockW=Math.min(fullW, lw+gap+rw);
  const x0=(c.width-blockW)/2, x1=x0+Math.max(lw,0)+gap;
  let y=M*0.8;
  g.textAlign='left';
  for(let i=0;i<2;i++){ if(Lt[i]) g.fillText(Lt[i],x0,y); if(Rt[i]) g.fillText(Rt[i],x1,y); y+=lh; }
  if(comp.length){
    y+=0.25*k; g.fillRect(x0,y,blockW,Math.max(2,0.25*k)); y+=0.65*k;
    lines.forEach(ln=>{
      let x=(c.width-ln.w)/2; const sp=zc*0.55;
      ln.items.forEach((it,j)=>{ if(j) x+=sp; F(800,zc); g.fillText(it.p+' ',x,y); x+=it.wp; F(500,zc); g.fillText(it.f,x,y); x+=it.wf; });
      y+=lhc;
    });
  }
  y+=0.9*k;
  const bc=document.createElement('canvas');
  JsBarcode(bc, s.code, {format:'CODE128', width:4, height:120, fontSize:34, margin:0, background:'#ffffff', lineColor:'#000000'});
  const maxW=c.width-4*k, maxH=c.height-y-1.5*k;
  const sc=Math.min(maxW/bc.width, maxH/bc.height);
  g.imageSmoothingEnabled=false;
  g.drawImage(bc,(c.width-bc.width*sc)/2,y,bc.width*sc,bc.height*sc);
  const pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:[W,H],compress:true});
  pdf.addImage(c.toDataURL('image/png'),'PNG',0,0,W,H,undefined,'FAST');
  const buf=pdf.output('arraybuffer');
  const filename=`Етикетка ${s.code}.pdf`;
  let dl=null;
  try{ dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; }catch(e){ dl=null; }
  if(dl){
    try{ await dl.save({filename, data:new Blob([buf])}); toast('Етикетку збережено: відкрийте PDF і надрукуйте'); }
    catch(e){ if(e && e.code!=='declined') toast('Не вдалося зберегти етикетку'); }
    return;
  }
  try{
    const url=URL.createObjectURL(new Blob([buf],{type:'application/pdf'}));
    const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},1500);
  }catch(e){ toast('Збереження тут недоступне'); }
}

/* Стиснення однакове для камери телефона й файлу з комп'ютера:
   довша сторона до 1280 px, далі підбираємо якість, поки не влізе в ~280 КБ. */
function compress(file){
  return new Promise((res,rej)=>{
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const max=1280, k=Math.min(1, max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*k)); c.height=Math.max(1,Math.round(img.height*k));
      const ctx=c.getContext('2d');
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);   // прозорий PNG не почорніє
      ctx.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);

      const LIMIT = 280*1024;
      let q = 0.78, out = c.toDataURL('image/jpeg', q);
      while(out.length*0.75 > LIMIT && q > 0.4){ q -= 0.08; out = c.toDataURL('image/jpeg', q); }
      res(out);
    };
    img.onerror = ()=>{URL.revokeObjectURL(url); rej();};
    img.src = url;
  });
}
function saveSku(id){
  const maker=$('#fMaker').value.trim(), art=$('#fArt').value.trim(), color=$('#fColor').value.trim(), code=$('#fCode').value.trim();
  const fe = m => { $('#ferr').innerHTML = `<div class="err">${m}</div>`; $('#panel').scrollTop=0; };
  if(!maker) return fe('Вкажіть виробника.');
  if(!art) return fe('Вкажіть артикул.');
  if(!code) return fe('Вкажіть або згенеруйте штрихкод.');
  if(S.skus.some(x=>x.code===code && x.id!==id && !x.deleted)) return fe('Такий штрихкод уже є в каталозі.');
  const comp = draftComp.map(x=>({f:String(x.f||'').trim(),p:x.p})).filter(x=>x.f||String(x.p).trim()!=='').map(x=>({f:x.f,p:parseFloat(x.p)}));
  if(comp.some(x=>!x.f)) return fe('Оберіть волокно в кожному рядку складу.');
  if(comp.some(x=>!(x.p>0)||x.p>100)) return fe('Відсоток складника має бути від 0 до 100.');
  if(new Set(comp.map(x=>x.f)).size!==comp.length) return fe('Одне волокно вказано двічі, об\'єднайте рядки.');
  if(comp.length && Math.abs(comp.reduce((a,x)=>a+x.p,0)-100)>0.01) return fe('Сума складу має бути 100%.');
  S.customFibers=S.customFibers||[]; comp.forEach(x=>{ if(!FIBER_TYPE[x.f] && !S.customFibers.includes(x.f)) S.customFibers.push(x.f); });
  if(id){
    const old=skuById(id);
    const nv={meter:$('#fMeter').value.trim(),sale:can('fin')?(parseFloat($('#fSale').value)||0):(+old.sale||0),maker,art,color,code,hex:draftHex,note:$('#fNote').value.trim()};
    const lbl={maker:'Бренд',art:'Артикул',color:'Колір',meter:'Nm',code:'Штрихкод',hex:'Відтінок',note:'Примітка',sale:'Ціна продажу'};
    const show=(k,v)=>k==='sale'?(v?fmtEur(v):'—'):(v===''||v==null?'—':String(v));
    const ch=Object.keys(lbl).filter(k=>String(old[k]??'')!==String(nv[k]??'')).map(k=>`${lbl[k]}: ${show(k,old[k])} → ${show(k,nv[k])}`);
    const op=old.photos.length, np=draftPhotos.length, samePh=op===np && old.photos.every((x,i)=>x===draftPhotos[i]);
    if(!samePh) ch.push(np>op?`Фото: додано (${op} → ${np})`:np<op?`Фото: прибрано (${op} → ${np})`:'Фото: замінено');
    const oc=compText(old.comp), nc=compText(comp);
    if(oc!==nc) ch.push(`Склад: ${oc||'—'} → ${nc||'—'}`);
    if(ch.length) audit(id,'edit',ch.join('; '));
    Object.assign(skuById(id), {comp,meter:$('#fMeter').value.trim(),sale:nv.sale,maker,art,color,code,hex:draftHex,note:$('#fNote').value.trim(),photos:[...draftPhotos]});
    if(save()){ toast('Зміни збережено'); openSku(id); render(); }
    return;
  }
  const kg=parseFloat($('#fKg').value)||0, cn=parseInt($('#fCn').value)||0;
  if((kg>0)!==(cn>0)) return fe('Для приходу вкажіть і кг, і кількість конусів.');
  const nid=uid();
  audit(nid,'create','Створено картку'+(draftPhotos.length?` з ${draftPhotos.length} фото`:''));
  S.skus.push({id:nid,createdBy:S.current,comp,meter:$('#fMeter').value.trim(),sale:can('fin')?(parseFloat($('#fSale').value)||0):0,maker,art,color,code,hex:draftHex,note:$('#fNote').value.trim(),photos:[...draftPhotos],created:now()});
  const price=parseFloat($('#fPrice')?.value)||0;
  if(kg>0){ const at=dateToIso($('#fDate').value); if(price>0) addCost(skuById(nid), at, price); S.ops.push({id:uid(),sku:nid,type:'in',kg,cones:cn,price,who:S.current,at,party:maker,comment:'Перша партія'}); }
  if(save()){ toast('SKU додано'); render(); openSku(nid); }
}

      <label class="f">${type==='res'?'Дата резерву':'Дата операції'}<input id="oDate" type="date" value="${todayStr()}" max="${todayStr()}"></label>

function saveOp(type, skuId, resId){
  const l=levels(skuId);
  const r = resId ? S.reserves.find(x=>x.id===resId && x.status==='active') : null;
  const kg=parseFloat($('#oKg').value)||0, cn=parseInt($('#oCn').value)||0;
  const price=parseFloat($('#oPrice')?.value)||0;
  const dv=$('#oDate').value, at=dateToIso(dv);
  const party=$('#oParty')?.value.trim()||'', com=$('#oCom').value.trim();
  const part=$('#oPart')?.checked;
  const fe = m => { $('#oerr').innerHTML = `<div class="err">${m}</div>`; $('#panel').scrollTop=0; };
  if(!dv) return fe('Вкажіть дату операції.');
  if(dv > todayStr()) return fe('Дата операції не може бути в майбутньому.');
  if(resId && !r) return fe('Цей резерв уже закритий.');
  if(type==='adj'){
    const fkv=$('#oKg').value.trim(), fcv=$('#oCn').value.trim();
    if(fkv===''||fcv==='') return fe('Впишіть фактичні кг і конуси.');
    const fk=parseFloat(fkv), fc=parseInt(fcv);
    if(fk<0 || fc<0) return fe('Фактичний залишок не може бути від\'ємним.');
    const dk=Math.round((fk-l.kg)*1000)/1000, dc=fc-l.cn;
    if(Math.abs(dk)<0.001 && dc===0) return fe('Фактичний залишок збігається з обліком, коригувати нічого.');
    if(fk < l.rk-0.001 || fc < l.rc) return fe(`У резерві ${fmtKg(l.rk)} кг / ${fmtN(l.rc)} к. Фактичний залишок не може бути меншим, спочатку зніміть або зменште резерв.`);
    S.ops.push({id:uid(),sku:skuId,type:'adj',kg:dk,cones:dc,who:S.current,at,comment:com||'Інвентаризація',counted:{kg:fk,cones:fc}});
  } else {
    if(kg<=0) return fe('Вкажіть вагу в кг.');
    if(type==='smp' && cn<0) return fe('Кількість конусів не може бути від\'ємною.');
    if(cn<=0 && type!=='smp' && !(type==='out' && part)) return fe(type==='out' ? 'Вкажіть кількість конусів або позначте «Частина конуса».' : 'Вкажіть кількість конусів.');
    if(type==='out' && !price) return fe('Вкажіть ціну продажу. Безкоштовні зразки проводьте через «Пробники».');
    if(type==='out'||type==='res'||type==='smp'){
      if(!party) return fe('Вкажіть клієнта.');
      const fk = l.fk + (r?r.kg:0), fc = l.fc + (r?r.cones:0);
      if(kg > fk+0.001) return fe(`Доступно лише ${fmtKg(fk)} кг. Решта в резерві або відсутня.`);
      if(cn > fc) return fe(`Доступно лише ${fmtN(fc)} конусів.`);
    }
    if(type==='res'){
      const u=$('#oUntil').value; if(!u) return fe('Вкажіть термін резерву.');
      const until=new Date(u+'T23:59:00');
      if(until < new Date()) return fe('Термін резерву вже минув.');
      S.reserves.push({id:uid(),sku:skuId,kg,cones:cn,price,client:party,until:until.toISOString(),status:'active',who:S.current,at,comment:com});
    } else {
      if(type==='in' && price>0) addCost(skuById(skuId), at, price);
      S.ops.push({id:uid(),sku:skuId,type,kg,cones:cn,price,partial:(type==='out'||type==='smp')&&cn===0,price:type==='smp'?0:price,who:S.current,at,party,comment:com,reserve:resId||undefined});
      if(r){ r.status='shipped'; r.closed=at; r.closedBy=S.current; }
    }
  }
  if(save()){ toast(r?'Резерв відвантажено':type==='res'?'Зарезервовано':type==='smp'?'Пробники видано':OPT[type]+' проведено'); render(); openSku(skuId); }
}
function shipReserve(id){

function cancelReserve(id){

/* scanner */
let reader=null, scanTarget=null;
function openScan(target){
  scanTarget = target||null;
  markNav('scanBtn');
  openSheet(`${head(scanTarget?'Код постачальника':'Сканер')}
    <video class="video" id="vid" playsinline muted></video>
    <p class="hint" id="scanMsg" style="margin-top:10px">Наведіть камеру на штрихкод.</p>
    <div class="scan-alt">
      <label class="btn ghost filebtn">Сфотографувати код<input type="file" accept="image/*" capture="environment" id="scanFile"></label>
      <div style="display:flex;gap:8px"><input id="manualCode" placeholder="Або введіть код" style="flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px"><button class="btn" id="manualGo">Знайти</button></div>
    </div>`);
  if(!window.ZXing){ $('#scanMsg').textContent='Бібліотека сканера не завантажилась. Введіть код вручну.'; return; }
  try{
    reader = new ZXing.BrowserMultiFormatReader();
    reader.decodeFromVideoDevice(undefined, 'vid', (res)=>{ if(res) found(res.getText()); })
      .catch(()=>{ $('#scanMsg').textContent='Камера тут недоступна. Сфотографуйте код кнопкою нижче або введіть його.'; });
  }catch(e){ $('#scanMsg').textContent='Камера тут недоступна. Сфотографуйте код кнопкою нижче або введіть його.'; }
}
function stopScan(){ try{ reader && reader.reset(); }catch(e){} reader=null; }
function found(code){
  code = String(code).trim(); if(!code) return;
  stopScan();
  if(navigator.vibrate) try{navigator.vibrate(60)}catch(e){}
  if(scanTarget==='sku'){
    const art=$('#fArt')?.value; closeSheet();
    openSkuForm(); $('#fArt').value = art||''; $('#fCode').value = code; toast('Код підставлено');
    return;
  }
  const s = S.skus.find(x=>x.code===code && !x.deleted);
  closeSheet();
  if(s) openSku(s.id);
  else { toast(`Код ${code} не знайдено`); if(can('sku')){ openSkuForm(); $('#fCode').value=code; } }
}
async function scanFromFile(file){
  $('#scanMsg').textContent='Розпізнаю…';
  const url = URL.createObjectURL(file);
  try{
    const r = new ZXing.BrowserMultiFormatReader();
    const res = await r.decodeFromImageUrl(url);
    found(res.getText());
  }catch(e){ $('#scanMsg').textContent='Код не розпізнано. Сфотографуйте ближче, рівно й при кращому світлі.'; }
  finally{ URL.revokeObjectURL(url); }
}

  if(d.copycreds){ copyCreds(d.copycreds); return; }
  if(d.rmuser){ removeUser(t); return; }
  if('dexport' in d){ exportDebt(); return; }
  if('export' in d){ openExport(); return; }
  if(d.xper){ xPeriod(d.xper); return; }
  if(d.edit){ openSkuForm(d.edit); return; }
  if('nohex' in d){
    draftHex=''; $('#hexPrev').style.background='var(--indigo-soft)'; $('#hexName').textContent='без відтінку';
    document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed','false'));
    return;
  }
  if(d.sw){
    draftHex=d.sw.toLowerCase();
    $('#fHex').value=d.sw.toLowerCase(); $('#hexPrev').style.background=d.sw; $('#hexName').textContent=d.swn+' · '+d.sw;
    document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed', b===t));
    setColorName(d.swn);
    return;
  }
  if(d.rmphoto!==undefined){ draftPhotos.splice(+d.rmphoto,1); drawSlots(); return; }
  if(d.oview){ openOrderView(d.oview); return; }
  switch(t.id){
    case 'addBtn': openSkuForm(); break;
    case 'scanBtn': if($('#sheet').classList.contains('open')) closeSheet(); openScan(); break;
    case 'fSave': saveSku(d.id||null); break;
    case 'oSave': saveOp(d.type, d.sku, d.res||null); break;
    case 'settingsBtn': openSettings(); break;
    case 'onlineBtn': openOnline(); break;
    case 'exportBtn': if($('#sheet').classList.contains('open')) closeSheet(); openExport(); break;
    case 'xGo': {
      const sheets=[...document.querySelectorAll('[data-xs]')].filter(b=>b.checked).map(b=>b.dataset.xs);
      const from=$('#xFrom').value, to=$('#xTo').value;
      if(from&&to&&from>to){ $('#xerr').innerHTML='<div class="err">Дата «з» пізніша за дату «по».</div>'; break; }
      $('#xerr').innerHTML=''; exportXlsx({sheets,from,to}); break; }
    case 'manualGo': found($('#manualCode').value); break;
    case 'logoutBtn': doLogout(); break;
  }
});
document.addEventListener('change', async e=>{
  const t=e.target;
  if(t.dataset && t.dataset.photo!==undefined && t.files[0]){
    try{ draftPhotos.push(await compress(t.files[0])); draftPhotos=draftPhotos.slice(0,3); drawSlots(); }
    catch(err){ toast('Не вдалося прочитати фото'); }
  }
  if(t.dataset && t.dataset.costact){ costAct(t.dataset.sku, t.dataset.costact); }
  if(t.id==='fPrice' || t.id==='fSale'){
    const c=parseFloat($('#fPrice')?.value)||0, sp=parseFloat($('#fSale')?.value)||0;
    if(c&&sp&&$('#fMk')) $('#fMk').textContent='Націнка: '+fmtPct((sp-c)/c*100);
  }
  if(t.id==='fHex'){ draftHex=t.value; $('#hexPrev').style.background=t.value; $('#hexName').textContent=t.value; document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed','false')); }
  if(t.id==='scanFile' && t.files[0]) scanFromFile(t.files[0]);
  if(t.dataset && t.dataset.cf!==undefined){ const i=+t.dataset.cf; if(t.value==='__manual'){ draftComp[i].f=''; draftComp[i].manual=true; drawComp(); $(`[data-cfm="${i}"]`)?.focus(); } else { draftComp[i].f=t.value; drawComp(); } }
  if(t.dataset && t.dataset.lsm!==undefined){ syncOD(); OD.lines[+t.dataset.lsm].sample=t.checked; drawOrderEditor(); }
  if(t.id==='odTerms'){ syncOD(); drawOrderEditor(); }
  if(t.id==='dMgr'){ dMgr=t.value; viewDebt(); }
  if(t.id==='oPer'){ const dd=new Date(), y=dd.getFullYear(), m=dd.getMonth(); const f=(Y,M,D)=>new Date(Date.UTC(Y,M,D)).toISOString().slice(0,10);
    [oFrom,oTo] = t.value==='month'?[f(y,m,1),todayStr()]:t.value==='prev'?[f(y,m-1,1),f(y,m,0)]:['','']; viewReserves(); }
  if(t.id==='oFrom'||t.id==='oTo'){ oFrom=$('#oFrom').value; oTo=$('#oTo').value; viewReserves(); }
  if(t.id==='xAll'){ document.querySelectorAll('[data-xs]').forEach(b=>b.checked=t.checked); xSync(); }
  if(t.dataset && t.dataset.xs){ xSync(); }
  if(t.id==='iRole'){ $('#iRoleDesc').textContent='Може: '+ROLE_DESC[t.value]; }
  if(t.dataset && t.dataset.urole){ setRole(t.dataset.urole, t.value); }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeSheet();
  if(e.key==='Enter' && e.target.id==='manualCode') found(e.target.value);
});
$('#q').addEventListener('input', ()=>render());
function clampLine(t){
  if(!OD) return;
  const isKg=t.dataset.lk!==undefined, i=+(isKg?t.dataset.lk:t.dataset.lc);
  const li=OD.lines[i]; if(!li) return;
  const max=isKg?li.maxKg:li.maxCn, v=parseFloat(t.value);
  const h=$(`[data-lhint="${i}"]`);
  if(!isNaN(v) && max!==undefined && v>max+0.0001){
    t.value = isKg ? String(max) : String(Math.floor(max));
    if(isKg) li.kg=t.value; else li.cones=t.value;
    t.classList.add('over');
    if(h){ h.dataset.base=h.dataset.base||h.textContent; h.textContent=`Більше немає вільного: максимум ${isKg?fmtKg(max)+' кг':fmtN(max)+' к'}`; h.classList.add('neg'); }
    clearTimeout(t._t); t._t=setTimeout(()=>{ t.classList.remove('over'); if(h&&h.dataset.base){ h.textContent=h.dataset.base; h.classList.remove('neg'); } },2500);
  }
}
document.addEventListener('input', e=>{ const t=e.target;
  if(t.dataset && (t.dataset.lk!==undefined||t.dataset.lc!==undefined)) clampLine(t); if(t.dataset && (t.dataset.lk!==undefined||t.dataset.lc!==undefined||t.dataset.lp!==undefined)) odTotal(); if(t.dataset && t.dataset.cp!==undefined){ draftComp[+t.dataset.cp].p=t.value; compTotal(); } if(t.dataset && t.dataset.cfm!==undefined){ draftComp[+t.dataset.cfm].f=t.value.replace(/\s+/g,' ').trimStart(); compTotal(); } });

boot();
})();
</script>
</body>
</html>
